description: >-
  FinOps view of Africa's Talking spend. Africa's Talking is prepaid and
  usage-metered: an account wallet is topped up and drawn down per SMS sent,
  per USSD session, per Voice minute/leg, per Airtime and Mobile Data
  disbursement, and per Payments transaction fee. Per-unit rates vary by
  country and carrier and are quoted in local currency, so unit costs are not
  reconciled here.
notes: >-
  Per-country, per-carrier rates change frequently; pull them from the pricing
  pages and the account dashboard during reconciliation. Multi-currency wallet
  balances complicate FOCUS BillingCurrency normalization.
sources:
- https://africastalking.com/pricing
- https://developers.africastalking.com
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Africa's Talking
serviceCategory: Communications
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Prepaid
  billingCurrency: Multi-Currency
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Africa's Talking
  ServiceCategory: Communications
  ProviderName: Africa's Talking
  PublisherName: Africa's Talking
  InvoiceIssuerName: Africa's Talking
