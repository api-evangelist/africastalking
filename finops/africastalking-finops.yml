meters:
- name: sms_messages
  description: SMS messages sent, billed per message at a per-country, per-carrier rate.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - country
  - shortCode
- name: premium_sms_messages
  description: Premium SMS messages with revenue share, billed per message.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - country
  - keyword
- name: ussd_sessions
  description: USSD sessions billed per session by country and short code.
  unit: sessions
  aggregation: sum
  dimensions:
  - account
  - country
  - serviceCode
- name: voice_minutes
  description: Voice usage billed per minute or per leg by country and direction.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - country
  - direction
- name: airtime_value
  description: Airtime distributed, billed at face value plus carrier margin.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - country
  - carrier
- name: mobile_data_bundles
  description: Mobile data bundles disbursed, billed per bundle by quantity and validity.
  unit: bundles
  aggregation: sum
  dimensions:
  - account
  - country
  - carrier
- name: payments_transaction_fees
  description: Payments transaction fees (percentage or flat) per mobile money transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - country
  - provider
principles:
- name: Visibility
  description: Pull wallet top-up and usage statements per product and country from the dashboard.
- name: Allocation
  description: Use distinct usernames/API keys and product names per workload to map spend to cost centers.
- name: Optimization
  description: Use dedicated short codes for high-volume SMS, enqueue large batches, and select cheaper carriers/countries where possible.
- name: Accountability
  description: Monitor multi-currency wallet balances and review per-country per-unit burn against budget regularly.
maintainers:
